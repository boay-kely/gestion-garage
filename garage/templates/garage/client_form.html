<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"><title>Modifier Client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
<div class="container">
    <div class="card shadow p-4">
        <h2>Modifier le client : {{ client.nom }} {{ client.prenom }}</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">Enregistrer les modifications</button>
            <a href="{% url 'client_list' %}" class="btn btn-secondary">Annuler</a>
        </form>
    </div>
</div>
</body>
</html>
