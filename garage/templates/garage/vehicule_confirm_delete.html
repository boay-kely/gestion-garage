<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"><title>Supprimer Véhicule</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
<div class="container">
    <div class="card shadow p-4 border-danger">
        <h2 class="text-danger">Confirmation de suppression</h2>
        <p>Êtes-vous sûr de vouloir supprimer le véhicule <strong>{{ vehicule.marque }} {{ vehicule.modele }} ({{ vehicule.immatriculation }})</strong> ?</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Oui, Supprimer</button>
            <a href="{% url 'vehicule_list' %}" class="btn btn-secondary">Annuler</a>
        </form>
    </div>
</div>
</body>
</html>
